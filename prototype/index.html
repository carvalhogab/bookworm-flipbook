<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookworm — interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0022ff;--brown:#c66005;--red:#e20e41;--cream:#fdf8f4;--ink:#101a52}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--cream);font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden}
.app{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:20px}
.panel{width:260px;flex:none}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brown)}
h1{font-size:26px;font-weight:900;line-height:1.1;margin:6px 0 6px;color:var(--blue)}
.sub{font-size:13px;line-height:1.45;opacity:.75;margin-bottom:18px}
.flows{display:flex;flex-direction:column;gap:8px}
.flow{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:14px;background:#fff;border:1.5px solid #ece3da;font-weight:800;font-size:15px;transition:.15s}
.flow small{font-size:11px;font-weight:800;color:var(--brown);letter-spacing:.08em}
.flow:hover{border-color:var(--blue)}
.flow.on{background:var(--blue);color:#fff;border-color:var(--blue)}.flow.on small{color:#cfd6ff}
.hint{margin-top:16px;font-size:13px;line-height:1.45;min-height:56px;padding:12px 14px;border-radius:14px;background:#fff3e8;color:#7a3c03;font-weight:700}
.tools{display:flex;gap:8px;margin-top:12px}
.tools button{all:unset;cursor:pointer;font-size:12px;font-weight:800;padding:8px 12px;border-radius:999px;border:1.5px solid #e0d5ca;background:#fff}
.tools button:hover{border-color:var(--blue);color:var(--blue)}
.stage{flex:none;display:flex;overflow:visible;align-items:center;justify-content:center}
.phone{flex:none;width:390px;height:896px;transform-origin:center center;border-radius:54px;background:#111;padding:0;box-shadow:0 30px 70px rgba(16,26,82,.28),0 0 0 10px #15161d,0 0 0 11px #2b2d3a;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden;border-radius:54px}
.layer{position:absolute;inset:0;will-change:transform}
.layer img{display:block;width:390px;position:absolute;top:0;left:0;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;border-radius:16px;cursor:pointer;z-index:5}
.hs.pulse::after{content:"";position:absolute;inset:-3px;border-radius:19px;border:2.5px solid rgba(255,255,255,.95);box-shadow:0 0 0 2px var(--blue);animation:pulse 1.6s ease-out infinite;pointer-events:none}
.hs.dark.pulse::after{border-color:#fff;box-shadow:0 0 0 2px var(--brown)}
@keyframes pulse{0%{opacity:.95;transform:scale(1)}70%{opacity:0;transform:scale(1.07)}100%{opacity:0}}
body.debug .hs{outline:2px dashed #e20e41;background:rgba(226,14,65,.12)}
.joined{position:absolute;z-index:6;border-radius:16px;background:var(--brown);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.bar{position:absolute;left:50%;bottom:7px;width:134px;height:5px;border-radius:3px;background:#0b0b2b;opacity:.0;z-index:7;transform:translateX(-50%)}
@media(max-width:820px){
 .app{flex-direction:column;gap:10px;padding:10px 10px 0;justify-content:flex-start}
 .panel{width:100%}.sub,.eyebrow,.hint{display:none}
 h1{font-size:17px;margin:0 0 8px}.flows{flex-direction:row;flex-wrap:wrap}.flow{padding:8px 10px;font-size:13px}.flow small{display:none}
 .tools{display:none}
}
</style></head>
<body>
<div class="app">
 <aside class="panel">
  <div class="eyebrow">Interactive prototype</div>
  <h1>Bookworm</h1>
  <p class="sub">Tap through the app. Pick a flow, then follow the pulsing button.</p>
  <div class="flows" id="flows"></div>
  <div class="hint" id="hint"></div>
  <div class="tools"><button id="restart">↺ Restart flow</button><button id="show">Show taps</button></div>
 </aside>
 <div class="stage" id="stage"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div>
</div>

  if(dir==='back'){hist.pop()}else hist.push(cur);
  const W=390,fwd=dir==='fwd',back=dir==='back';
  screenEl.appendChild(next);
  const t='transform .38s cubic-bezier(.22,.8,.3,1)';
  if(dir==='fade'){next.style.opacity=0;next.style.transition='opacity .25s';requestAnimationFrame(()=>next.style.opacity=1)}
  else{next.style.transform=`translateX(${fwd?W:-W*0.3}px)`;if(back)next.style.zIndex=0,old.style.zIndex=1;
    old.style.transition=t;next.style.transition=t;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{next.style.transform='none';old.style.transform=`translateX(${fwd?-W*0.3:W}px)`}))}
  setTimeout(()=>{old.remove();next.style.transition='';next.style.transform='';next.style.zIndex='';busy=false;cur=id;
    if(id==='club'&&!joined&&!hist.includes('club'));updateHint()},dir==='fade'?260:400);
  cur=id;
}
function startFlow(f,force){
  flow=f;joined=false;hist=[];
  document.querySelectorAll('.flow').forEach(b=>b.classList.toggle('on',b.dataset.id===f.id));
  document.getElementById('hint').textContent=f.hint;
  screenEl.innerHTML='';cur=null;busy=false;go(f.start);
}
function updateHint(){document.getElementById('hint').textContent=flow.hint}
const fl=document.getElementById('flows');
FLOWS.forEach(f=>{const b=document.createElement('button');b.className='flow';b.dataset.id=f.id;b.innerHTML=`<small>${f.n}</small>${f.title}`;b.onclick=()=>startFlow(f);fl.appendChild(b)});
document.getElementById('restart').onclick=()=>startFlow(flow);
document.getElementById('show').onclick=()=>document.body.classList.toggle('debug');
if(location.search.includes('debug'))document.body.classList.add('debug');
document.addEventListener('keydown',e=>{if(e.key==='h')document.body.classList.toggle('debug');if(e.key==='ArrowLeft'&&hist.length)go(hist[hist.length-1],'back')});
function fit(){
  const narrow=innerWidth<=820;
  const panelH=narrow?document.querySelector('.panel').offsetHeight+16:0;
  const availH=innerHeight-panelH-(narrow?10:40), availW=narrow?innerWidth-20:innerWidth-260-56-60;
  const s=Math.min(availH/(896+24),availW/(390+24),1.25);
  phone.style.transform=`scale(${s})`;
  const st=document.getElementById('stage');st.style.width=(390*s+24)+'px';st.style.height=(896*s+24)+'px';
}
addEventListener('resize',fit);fit();
startFlow(FLOWS[0]);
</script></body></html>
